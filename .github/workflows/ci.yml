name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install the package and dev dependencies
        run: "python -m pip install -e .[dev]"

      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -t .

      - name: Check the example packs
        run: |
          set -e
          PYTHONPATH=src python -m ctxverify check examples/clean-pack
          echo "examples/clean-pack exited 0 as expected"

          set +e
          PYTHONPATH=src python -m ctxverify check examples/broken-pack
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected examples/broken-pack to exit 1, got $status"
            exit 1
          fi
          echo "examples/broken-pack exited 1 as expected"

      - name: Check that the README quotes real output
        run: |
          set -e
          PYTHONPATH=src python -m unittest tests.test_docs -v
